name: Gerar APK Android (FXGL)

on:
  workflow_dispatch:
  push:
    branches: [ main, mobile ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências básicas do Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ zlib1g-dev zip unzip

      - name: Baixar e configurar Gluon GraalVM (Java 17)
        run: |
          wget -q https://github.com/gluonhq/graal/releases/download/gluon-22.1.0.1-Final/graalvm-svm-java17-linux-gluon-22.1.0.1-Final.tar.gz
          tar -xzf graalvm-svm-java17-linux-gluon-22.1.0.1-Final.tar.gz
          echo "GRAALVM_HOME=$PWD/graalvm-svm-java17-linux-gluon-22.1.0.1-Final" >> $GITHUB_ENV
          echo "JAVA_HOME=$PWD/graalvm-svm-java17-linux-gluon-22.1.0.1-Final" >> $GITHUB_ENV
          echo "$PWD/graalvm-svm-java17-linux-gluon-22.1.0.1-Final/bin" >> $GITHUB_PATH

      - name: Compilar e empacotar APK
        working-directory: pacman
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B -ntp -e -Pandroid gluonfx:build gluonfx:package

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: pacman-apk
          path: pacman/target/gluonfx/aarch64-android/gvm/*.apk